<!doctype html>
<html lang="ja">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no" />
  <meta name="theme-color" content="#7fd4cf" />
  <title>漁夫の利</title>
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=Baloo+2:wght@500;600;700;800&family=M+PLUS+Rounded+1c:wght@500;700;800&display=swap" rel="stylesheet" />
  <link rel="stylesheet" href="/src/styles.css" />
  <link rel="icon" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'><text y='.9em' font-size='90'>🐟</text></svg>" />
</head>
<body>
  <div id="app">
    <canvas id="game-canvas"></canvas>

    <!-- Cinematic frame -->
    <div id="vignette"></div>
    <div id="flash"></div>

    <!-- HUD -->
    <div id="hud" class="hidden">
      <div id="score-panel">
        <div class="score-row">
          <span class="score-label">スコア</span>
          <span id="score-value" class="score-value">0</span>
        </div>
        <div class="score-row best">
          <span class="score-label">ベスト</span>
          <span id="best-value" class="score-value">0</span>
        </div>
        <div class="score-row best">
          <span class="score-label">最高コンボ</span>
          <span id="best-combo-value" class="score-value">0</span>
        </div>
      </div>
      <div id="combo-badge" class="hidden">
        <span id="combo-value">0</span><span class="combo-label">コンボ</span>
      </div>
      <div id="combo-burst"></div>
      <div id="hold-panel" class="hidden">
        <div id="multiplier">×1.0</div>
        <div id="round-points">+0</div>
        <div id="hold-time">0.0秒</div>
      </div>
      <div id="hint">長押しでハマグリを盗む。<br/>漁師が網を投げる前に離そう。<br/>逃げ続けるとコンボ倍率アップ!</div>
    </div>

    <!-- Title screen -->
    <div id="title-screen" class="screen">
      <div class="screen-inner">
        <div class="title-art">🎣</div>
        <h1 class="game-title"><span>漁夫の利</span></h1>
        <p class="subtitle">どこまで逃げ切れる?</p>
        <p class="instructions">長押しで盗んで、捕まる前に離す。</p>
        <button id="start-btn" class="btn btn-primary">ハマグリを盗む</button>
        <div class="title-best hidden" id="title-best">ベストスコア <span id="title-best-value">0</span> ・ 最高コンボ <span id="title-best-combo">0</span></div>
      </div>
    </div>

    <!-- Game-over screen (endless run ends) -->
    <div id="result-screen" class="screen hidden">
      <div class="screen-inner">
        <div id="result-icon" class="title-art">🎣</div>
        <h2 id="result-title">御用だ!</h2>
        <p id="result-message" class="subtitle"></p>
        <div id="result-stats">
          <div class="stat"><span class="stat-value" id="result-score">0</span><span class="stat-label" id="result-score-label">合計スコア</span></div>
          <div class="stat"><span class="stat-value" id="result-mult">0</span><span class="stat-label" id="result-mult-label">盗んだ回数</span></div>
          <div class="stat"><span class="stat-value" id="result-time">0.0秒</span><span class="stat-label" id="result-time-label">生存時間</span></div>
        </div>
        <div id="result-best" class="title-best hidden">ハイスコア更新!</div>
        <button id="retry-btn" class="btn btn-primary">もう一度盗む <span class="key-cap">R</span></button>
      </div>
    </div>

    <button id="mute-btn" aria-label="サウンド切り替え">🔊</button>
  </div>
  <script type="module" src="/src/main.js"></script>
</body>
</html>
